[audio]
enable_overdrive = true

[bar.default]
background_opacity = 0.75
center = [ "weather", "date", "media", "notifications", "tray" ]
end = [ "caffeine", "output_volume", "cpu", "ram", "network", "bluetooth", "brightness", "battery" ]
margin_edge = 5.0
margin_ends = 5.0
shadow = false
start = [ "taskbar" ]

[desktop_widgets]
enabled = false

[idle]
behavior_order = [ "lock", "screen-off", "suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 600

    [idle.behavior.suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900

[location]
auto_locate = true

[lockscreen]
blurred_desktop = true

[lockscreen_widgets]
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 0.0
    box_width = 0.0
    cx = 960.0
    cy = 957.0
    output = "HDMI-A-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_login_button = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 0.0
    box_width = 0.0
    cx = 854.0
    cy = 944.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_login_button = true

[notification]
background_opacity = 0.74999998323619366

[osd]
background_opacity = 0.74999998323619366
position = "bottom_center"

[shell]
font_family = "Iosevka NF"
polkit_agent = true
settings_show_advanced = true

    [shell.panel]
    control_center_placement = "floating"
    launcher_categories = false
    transparency_mode = "glass"

[theme]
builtin = "Tokyo-Night"
community_palette = "Lilac AMOLED"
mode = "dark"
source = "community"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "niri", "qt" ]
    community_ids = [ "vicinae", "steam" ]

[wallpaper]
directory = "/home/zaheenj/Pictures/wallpapers"

    [wallpaper.default]
    path = "/home/zaheenj/Pictures/wallpapers/lakeside_canoe_sunset.jpg"

    [wallpaper.last]
    path = "/home/zaheenj/Pictures/wallpapers/lakeside_canoe_sunset.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/zaheenj/Pictures/wallpapers/lakeside_canoe_sunset.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/zaheenj/Pictures/wallpapers/lakeside_canoe_sunset.jpg"

[weather]
auto_locate = true
unit = "imperial"

[widget.clock]
format = "{:%l:%M %p}"

[widget.date]
anchor = true
format = "{:%l:%M %p %a %d %b}"

[widget.taskbar]
group_by_workspace = true